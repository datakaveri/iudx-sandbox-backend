namespace: registry

persistence:
  enabled: true
  storageClass: ebs-csi-storage-class

autoscaling:
  enabled: true

storage: s3

s3:
  region: ap-south-1
  regionEndpoint: s3.ap-south-1.amazonaws.com
  bucket: iudx-sandbox-registry
  rootdirectory: /container
  encrypt: false
  secure: true

ingress:
  enabled: true
  hosts:
    - private-registry.iudx.org.in
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tls:
    - secretName: private-registry-iudx-org-in-tls
      hosts:
        - private-registry.iudx.org.in

