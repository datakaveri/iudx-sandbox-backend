apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxserver-deployment
  namespace: iudx-sandbox
spec:
  selector:
    matchLabels:
      app: sandboxserver
  template:
    metadata:
      labels:
        app: sandboxserver
    spec:
      imagePullSecrets:
      - name: image-pull-secret
      containers:
      - name: sandboxserver-container
        image: private-registry.iudx.org.in/sandbox-backend-dev:latest
        imagePullPolicy: Always

        env:
          - name: LOG_LEVEL
            value: DEBUG
          - name: GO_ENV
            value: prod
          - name: API_PORT
            value: 8080
          - name: POSTGRES_USER
            value: <user>
          - name: POSTGRES_PASSWORD
            value: <password>
          - name: POSTGRES_HOST
            value: <host>
          - name: POSTGRES_PORT
            value: 5432
          - name: POSTGRES_DB
            value: <db>
          - name: BINDERHUB_API
            value: https://playground.iudx.org.in
          - name: JUPYTERHUB_API
            value: https://hub.playground.iudx.org.in/hub/api
          - name: JUPYTERHUB_API_TOKEN
            value: <token>
          - name: KEYCLOAK_PUBLIC_KEY
            value: <key>
          - name: STATIC_API_KEY
            value: <some-strong-value>

        ports:
        - containerPort: 8080

      tolerations:
      - key: "target.application"
        operator: "Equal"
        value: "sandbox"
        effect: "NoSchedule"
